<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;font-family:var(--font-sans)}.r{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:18px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;font-size:11px}.sw b{font-weight:600;font-size:13px}.m{font-size:11px;color:var(--text-secondary)}body{background:var(--white)}</style>
</head><body><div class="r" style="padding:14px;border-radius:24px;background:var(--bg-canvas)">
<div class="sw" style="background:var(--surface-card);height:110px"><b>--surface-card</b><span>widgets</span></div>
<div class="sw" style="background:var(--surface-chip);height:110px"><b>--surface-chip</b><span>chips, tracks</span></div>
<div class="sw" style="background:var(--surface-inverse);color:var(--white);height:110px"><b>--surface-inverse</b><span>hero card, active pill</span></div>
<div class="sw" style="background:var(--surface-accent);color:var(--white);height:110px"><b>--surface-accent</b><span>tags, highlights</span></div>
<div class="sw" style="background:var(--surface-glass);backdrop-filter:blur(18px);height:110px;box-shadow:inset 0 0 0 1px var(--overlay-light)"><b>--surface-glass</b><span>overlay cards</span></div></div></body></html>
