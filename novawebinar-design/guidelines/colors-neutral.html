<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;font-family:var(--font-sans)}.r{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:18px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;font-size:11px}.sw b{font-weight:600;font-size:13px}.m{font-size:11px;color:var(--text-secondary)}body{background:var(--white)}</style>
</head><body><div class="r"><div class="sw" style="background:var(--white);color:var(--navy);height:110px;box-shadow:inset 0 0 0 1px var(--border-subtle)"><b>White</b><span>#FFFFFF</span></div><div class="sw" style="background:var(--surface-card);color:var(--navy);height:110px;box-shadow:inset 0 0 0 1px var(--border-subtle)"><b>Surface</b><span>#FAFBFC</span></div><div class="sw" style="background:var(--light-gray);color:var(--navy);height:110px;box-shadow:inset 0 0 0 1px var(--border-subtle)"><b>Light gray</b><span>#F1F3F6</span></div><div class="sw" style="background:var(--mist);color:var(--navy);height:110px;"><b>Chip</b><span>#E6EAF0</span></div><div class="sw" style="background:var(--silver);color:var(--navy);height:110px;"><b>Silver</b><span>#C5CCD8</span></div><div class="sw" style="background:var(--slate);color:var(--white);height:110px;"><b>Slate</b><span>#8792A6</span></div><div class="sw" style="background:var(--gray-600);color:var(--white);height:110px;"><b>Texto 2</b><span>#56627A</span></div><div class="sw" style="background:var(--navy);color:var(--white);height:110px;"><b>Navy</b><span>#0F1B2D</span></div></div></body></html>
