<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novawebinar — Painel</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{background:var(--gray-150);min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:20px 0}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="PainelScreen.jsx"></script>
<script type="text/babel">
const { BottomNav, IconButton } = window.OrvionDesignSystem_1d6ac1;
const TABS = [
  { id: 'painel', label: 'Painel', icon: 'layout-grid' },
  { id: 'webinars', label: 'Webinars', icon: 'clapperboard' },
  { id: 'calendario', label: 'Calendário', icon: 'calendar-days' },
  { id: 'definicoes', label: 'Definições', icon: 'sliders-horizontal' },
];
function App() {
  const [tab, setTab] = React.useState(() => localStorage.getItem('cw-app-tab') || 'painel');
  const go = t => { setTab(t); localStorage.setItem('cw-app-tab', t); };
  const current = TABS.find(t => t.id === tab);
  return (
    <div style={{ position: 'relative', width: 390, height: 844, borderRadius: 36, overflow: 'hidden', background: 'var(--bg-canvas)', display: 'flex', flexDirection: 'column', boxShadow: 'var(--shadow-float)' }}>
      <AppHeader />
      <main style={{ flex: 1, minHeight: 0, overflowY: 'auto' }}>
        {tab === 'painel' ? <PainelScreen onNew={() => go('webinars')} /> : <EmptyTab label={current.label} />}
      </main>
      <IconButton icon="headset" variant="accent" size={56} label="Suporte" style={{ position: 'absolute', right: 16, bottom: 92, boxShadow: 'var(--shadow-pop)' }} />
      <BottomNav items={TABS} value={tab} onChange={go} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
