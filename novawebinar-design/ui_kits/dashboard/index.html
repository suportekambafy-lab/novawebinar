<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Novawebinar — Painel desktop</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{background:var(--bg-canvas)}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="TopBar.jsx"></script>
<script type="text/babel" src="PageShell.jsx"></script>
<script type="text/babel" src="DashboardScreen.jsx"></script>
<script type="text/babel" src="AnalyticsScreen.jsx"></script>
<script type="text/babel">
function App() {
  const [tab, setTab] = React.useState(() => localStorage.getItem('cw-dashboard-tab') || 'dashboard');
  const go = t => { setTab(t); localStorage.setItem('cw-dashboard-tab', t); };
  return (
    <div style={{ maxWidth: 1440, margin: '0 auto', padding: '24px 32px 40px' }}>
      <TopBar tab={tab} onTab={go} />
      {tab === 'dashboard' && <DashboardScreen />}
      {tab === 'analytics' && <AnalyticsScreen />}
      {tab === 'pulse' && <PlaceholderScreen name="Ao vivo" />}
      {tab === 'data' && <PlaceholderScreen name="Dados" />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
