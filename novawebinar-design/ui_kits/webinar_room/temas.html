<!-- @dsCard group="App Novawebinar" viewport="900x960" name="Sala ao vivo · claro e escuro" subtitle="Os dois temas lado a lado; sol/lua troca cada um" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sala ao vivo — claro e escuro</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--gray-150)}a{color:var(--accent-strong)}a:hover{color:var(--navy)}
header{padding:32px 40px 0}h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.03em}header p{margin:6px 0 0;color:var(--text-secondary);font-size:15px}
main{display:flex;flex-wrap:wrap;gap:40px;padding:24px 40px 48px;justify-content:center}html,body{min-width:0}
figure{margin:0;display:flex;flex-direction:column;gap:12px}figcaption b{font-size:18px;font-weight:600;letter-spacing:-.02em}figcaption span{display:block;font-size:13px;color:var(--text-secondary);margin-top:2px}
@keyframes livePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}.live-dot{animation:livePulse 1.4s ease-in-out infinite}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.msg-in{animation:msgIn .28s cubic-bezier(.2,.7,.2,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.slide-up{animation:slideUp .36s cubic-bezier(.2,.7,.2,1)}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}.toast-in{animation:toastIn .3s cubic-bezier(.2,.7,.2,1)}</style>
</head>
<body>
<header><h1>Sala ao vivo — claro e escuro</h1><p>As duas versões lado a lado, a funcionar. O botão sol/lua junto ao título troca o tema de cada telemóvel.</p></header>
<div id="root"></div>
<script type="text/babel" src="./RoomParts.jsx"></script>
<script type="text/babel" src="./RoomScreen.jsx"></script>
<script type="text/babel">
function Phone({ initial, label, sub }) {
  const [theme, setTheme] = React.useState(initial);
  return (
    <figure>
      <figcaption><b>{label}</b><span>{sub}</span></figcaption>
      <div data-room-theme={theme} style={{ width: 390, height: 844, borderRadius: 36, overflow: 'hidden', boxShadow: 'var(--shadow-float)' }}>
        <RoomScreen theme={theme} onToggleTheme={() => setTheme(t => (t === 'dark' ? 'light' : 'dark'))} />
      </div>
    </figure>
  );
}
function App() {
  return (
    <main>
      <Phone initial="light" label="Claro" sub="Fundo branco, oferta em laranja-suave" />
      <Phone initial="dark" label="Escuro · Grafite neutro" sub="#141414 com oferta contornada a laranja" />
    </main>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
