<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novawebinar — Sala ao vivo</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{background:var(--gray-150);min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:20px 0}
@keyframes livePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}.live-dot{animation:livePulse 1.4s ease-in-out infinite}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.msg-in{animation:msgIn .28s cubic-bezier(.2,.7,.2,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.slide-up{animation:slideUp .36s cubic-bezier(.2,.7,.2,1)}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}.toast-in{animation:toastIn .3s cubic-bezier(.2,.7,.2,1)}
@media (prefers-reduced-motion:reduce){.live-dot,.msg-in,.slide-up,.toast-in{animation:none}}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="RoomParts.jsx"></script>
<script type="text/babel" src="RoomScreen.jsx"></script>
<script type="text/babel">
function App() {
  const [theme, setTheme] = React.useState(() => localStorage.getItem('cw-room-theme') || 'dark');
  const toggle = () => setTheme(t => { const n = t === 'dark' ? 'light' : 'dark'; localStorage.setItem('cw-room-theme', n); return n; });
  return (
    <div data-room-theme={theme} style={{ width: 390, height: 844, borderRadius: 36, overflow: 'hidden', boxShadow: 'var(--shadow-float)' }}>
      <RoomScreen theme={theme} onToggleTheme={toggle} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
